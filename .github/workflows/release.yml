name: Release

# A version tag builds both apps from the same commit and publishes them together.
# The IPA is unsigned on purpose: whoever installs it re-signs it with their own Apple ID
# (Sideloadly, AltStore). The APK cannot be unsigned — Android refuses to install one — so
# it carries the GitHub release key from the repository secrets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Whether Android has anything new since the previous tag. A release that only touched
  # the iOS side ships no APK: rebuilding the same app under a new number would offer
  # Android readers an update with nothing in it. The version bump itself is not a change —
  # every release moves versionName and versionCode — so those two lines are left out.
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.android.outputs.changed }}
      since: ${{ steps.android.outputs.since }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: android
        run: |
          since=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -z "$since" ]; then
            changed=true
          elif git diff "$since" HEAD -- android/ | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---) ' \
              | grep -Eqv '^[+-][[:space:]]*version(Code|Name)[[:space:]]*='; then
            changed=true
          else
            changed=false
          fi
          echo "Android changed since ${since:-the first commit}: $changed"
          echo "changed=$changed" >>"$GITHUB_OUTPUT"
          echo "since=$since" >>"$GITHUB_OUTPUT"

  ios:
    # Xcode 27, the one the App Store build comes from. Still a preview label on GitHub.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen && xcodegen generate
      - run: |
          xcodebuild -project NovelReader.xcodeproj -scheme NovelReader \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/NovelReader.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive
      # -exportArchive insists on signing, so the IPA is zipped by hand.
      - run: |
          mkdir build/Payload
          cp -R build/NovelReader.xcarchive/Products/Applications/NovelReader.app build/Payload/
          cd build && zip -qry "NovelReader-$GITHUB_REF_NAME-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: build/*.ipa

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: base64 -d <<<"$KEYSTORE" > "$RUNNER_TEMP/release.p12"
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: mv app/build/outputs/apk/release/app-release.apk "NovelReader-$GITHUB_REF_NAME.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: android/*.apk

  release:
    needs: [changes, ios, android]
    # A skipped Android build still releases the IPA; a failed one, or a failed check of
    # whether to build it, releases nothing.
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.ios.result == 'success'
      && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # Said on the release when there is no APK, so an Android reader looking for one is
      # pointed at the release that has the current build rather than left to wonder.
      - run: |
          shopt -s nullglob
          notes=()
          if [ "$ANDROID" != true ]; then
            notes=(--notes "Android is unchanged since $SINCE; its APK is on that release.")
          fi
          gh release create "$GITHUB_REF_NAME" *.ipa *.apk --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes "${notes[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID: ${{ needs.changes.outputs.android }}
          SINCE: ${{ needs.changes.outputs.since }}
