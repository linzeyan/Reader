name: NovelReader
options:
  bundleIdPrefix: com.zeyanlin
  deploymentTarget:
    iOS: "17.0"
  # Authored in Traditional Chinese; Simplified Chinese and English are translations.
  developmentLanguage: zh-Hant

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

targets:
  NovelReader:
    type: application
    platform: iOS
    sources:
      - path: NovelReader
        excludes:
          - Info.plist
          - NovelReader.entitlements
    dependencies:
      - package: GRDB
        product: GRDB
    # The shipping binary must contain no site rules at all (App Review 5.2 —
    # the app must not point at any particular content source). But the UI is
    # unusable in a simulator without sources, so Debug builds get the recon
    # rules copied in from the notes repo and SiteStore seeds itself from them.
    # Release builds have neither this folder nor the code path that reads it.
    postBuildScripts:
      - name: Seed development site rules (Debug only)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SEED_SRC="$SRCROOT/../dev_docs/novel_reader/sites"
          DEST="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/DevSiteRules"
          rm -rf "$DEST"
          if [ "$CONFIGURATION" = "Debug" ] && [ -d "$SEED_SRC" ]; then
            mkdir -p "$DEST"
            cp "$SEED_SRC"/*.json "$DEST/"
            echo "seeded $(ls "$DEST" | wc -l | tr -d ' ') development site rules"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyanlin.novelreader
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NovelReader/Info.plist
        # iCloud KVS carries bookmarks / progress / download index (metadata only).
        CODE_SIGN_ENTITLEMENTS: NovelReader/NovelReader.entitlements
        # Simulator: ad-hoc signing, no Apple account needed.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
        # Device / TestFlight / App Store: standard automatic signing.
        CODE_SIGN_STYLE[sdk=iphoneos*]: Automatic
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
        DEVELOPMENT_TEAM[sdk=iphoneos*]: NKJSLB6HBR

  NovelReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NovelReaderTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NovelReader

  # Drives the real UI. Kept out of `make test` (see the Makefile) because it
  # boots the app for every case and is an order of magnitude slower than the
  # unit suite.
  NovelReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NovelReaderUITests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NovelReader

schemes:
  NovelReader:
    build:
      targets:
        NovelReader: all
        NovelReaderTests: [test]
        NovelReaderUITests: [test]
    test:
      targets:
        - NovelReaderTests
        - NovelReaderUITests
    run:
      config: Debug
